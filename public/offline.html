<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Akshara Academy - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #F8F9FD;
      color: #1A1D26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: #F3E8FF;
      color: #7B1FA2;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1A1D26;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry-btn {
      background: #7B1FA2;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
      transition: background 0.2s;
    }
    .retry-btn:active {
      background: #5E127D;
      transform: scale(0.98);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #FEF2F2;
      border: 1px solid rgba(185, 28, 28, 0.2);
      color: #B91C1C;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9999px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #B91C1C;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-pill">
      <span class="dot"></span>
      <span>No Connection</span>
    </div>
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Akshara Academy</h1>
    <p>Unable to connect to the academy portal. Please check your mobile data or Wi-Fi network and try again.</p>
    <button class="retry-btn" onclick="retryConnection()">Check Connection & Retry</button>
  </div>

  <script>
    function retryConnection() {
      window.location.href = '/';
    }

    // Auto-reconnect when device comes back online
    window.addEventListener('online', function() {
      retryConnection();
    });
  </script>
</body>
</html>
